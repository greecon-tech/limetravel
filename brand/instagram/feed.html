<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Noto Serif";src:url("../../public/assets/fonts/noto-serif-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal}
@font-face{font-family:"Noto Serif";src:url("../../public/assets/fonts/noto-serif-latin-wght-italic.woff2") format("woff2");font-weight:100 900;font-style:italic}
@font-face{font-family:"Inter";src:url("../../public/assets/fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
body{width:3240px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;color:#f6f4ec}
.deck{position:relative;display:flex;width:3240px;height:1350px;background:linear-gradient(90deg,rgba(9,41,29,0) 55%,rgba(9,41,29,.42) 100%),linear-gradient(180deg,rgba(9,41,29,.6) 0%,rgba(9,41,29,.5) 45%,rgba(9,41,29,.72) 100%),url("bg-panorama.jpg") center/cover,#09291d}
.slide{position:relative;flex:none;width:1080px;height:1350px;padding:96px 96px 0}
.logo{display:block;width:340px;height:auto}
.eyebrow{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#a6ce39}
.eyebrow::before{content:"";width:44px;height:5px;border-radius:5px;background:#a6ce39}
h1,h2{font-family:"Noto Serif",serif;font-weight:400;letter-spacing:-.03em;color:#f6f4ec;text-shadow:0 2px 40px rgba(9,41,29,.45)}
em{font-style:italic;color:#a6ce39}
.hint{position:absolute;right:96px;bottom:292px;font-size:28px;font-weight:500;color:rgba(246,244,236,.72);letter-spacing:.02em}
.wave{position:absolute;left:0;bottom:0;width:3240px;height:330px}

/* slide 1 */
.s1 h1{position:absolute;left:96px;top:330px;font-size:158px;line-height:1.02}
.s1 .gap{display:block;height:34px}
/* slide 2 */
.s2 .eyebrow{margin-top:112px}
.s2 h2{margin-top:30px;font-size:104px;line-height:1.04}
.rows{position:absolute;left:96px;right:96px;top:520px;display:grid;gap:26px}
.row{display:flex;align-items:center;gap:36px;height:178px;padding:0 44px;border:1.5px solid rgba(255,255,255,.2);border-radius:46px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%)}
.ico{flex:none;width:92px;height:92px;display:grid;place-items:center;border-radius:50%;border:2px solid rgba(166,206,57,.7);color:#a6ce39}
.ico svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row p{font-family:"Noto Serif",serif;font-size:46px;white-space:nowrap;line-height:1.12;letter-spacing:-.02em;color:#f6f4ec}
.row small{margin-left:auto;font-size:26px;font-weight:500;color:rgba(246,244,236,.5);letter-spacing:.06em}
/* slide 3 */
.s3 .eyebrow{margin-top:112px}
.s3 h2{margin-top:30px;font-size:112px;line-height:1.04}
.contact{position:absolute;left:96px;right:96px;top:690px;display:grid;gap:28px}
.pill{display:flex;align-items:center;gap:30px;height:164px;padding:0 48px;border:1.5px solid rgba(255,255,255,.22);border-radius:82px;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);font-size:46px;font-weight:500;letter-spacing:-.005em;color:#f6f4ec}
.pill.main{background:#a6ce39;border-color:#a6ce39;color:#09291d}
.pill .ico{width:76px;height:76px;border-color:currentColor;opacity:.95}
.pill .ico svg{width:40px;height:40px}
.pill.main .ico{color:#09291d}
.s3 .note{position:absolute;left:96px;bottom:292px;font-size:28px;color:rgba(246,244,236,.7)}
</style>
</head>
<body>
<div class="deck">
  <svg class="wave" viewBox="0 0 3240 330" aria-hidden="true">
    <path d="M0 262 C 480 150 980 186 1620 268 S 2800 336 3240 168 C 2800 410 2000 340 1500 312 S 480 250 0 262 Z" fill="#a6ce39"/>
    <path d="M0 214 C 520 112 1040 150 1660 226 S 2760 290 3240 126" fill="none" stroke="#a6ce39" stroke-opacity=".3" stroke-width="3"/>
  </svg>

  <section class="slide s1">
    <img class="logo" src="../../public/assets/img/wordmark-reverse-1200.webp" alt="LimeTravel">
    <h1>Udhëto me<br>shije.<span class="gap"></span>Kthehu me<br><em>kujtime.</em></h1>
    <p class="hint">Rrëshqitni →</p>
  </section>

  <section class="slide s2">
    <img class="logo" src="../../public/assets/img/wordmark-reverse-1200.webp" alt="LimeTravel">
    <p class="eyebrow">Shërbimet tona</p>
    <h2>Çfarë <em>ju ofrojmë.</em></h2>
    <div class="rows">
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></div>
        <p>Udhëtime turistike</p><small>01</small>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.500 1.500L13 8 4.800 6.200c-.5-.1-.9.1-1.100.5l-.2.4c-.2.5-.1 1 .3 1.300L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.500 5.300c.3.4.8.5 1.300.3l.4-.2c.4-.3.6-.7.5-1.200z"/></svg></div>
        <p>Bileta avioni</p><small>02</small>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8.500 16.500h7"/></svg></div>
        <p>Shërbime vizash turistike</p><small>03</small>
      </div>
    </div>
  </section>

  <section class="slide s3">
    <img class="logo" src="../../public/assets/img/wordmark-reverse-1200.webp" alt="LimeTravel">
    <p class="eyebrow">Kontakt</p>
    <h2>Na shkruani për <em>kërkesën tuaj.</em></h2>
    <div class="contact">
      <div class="pill main">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M3.500 20.500l1.300-4.200A8.500 8.500 0 1 1 8 19.300z"/><path d="M9 8.800c0 3.200 3 6.200 6.200 6.200l1-1.600-2-1-.9.700c-.9-.4-1.900-1.400-2.300-2.300l.7-.9-1-2z"/></svg></div>
        WhatsApp +355 69 539 7514
      </div>
      <div class="pill">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.500 2.500 3.800 5.500 3.800 9s-1.300 6.500-3.800 9c-2.500-2.500-3.800-5.500-3.800-9S9.500 5.500 12 3z"/></svg></div>
        www.limetravel.al
      </div>
    </div>
  </section>
</div>
</body>
</html>
